# Scalp City configuration.
# Secrets are NOT stored here — set them as environment variables (see README):
#   POLYGON_API_KEY, ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY, SCALPCITY_ALERT_WEBHOOK (optional)

mode: paper                 # backtest | replay | paper | live   (CLI command overrides this)
market: options             # options (this file) | crypto (see config.crypto.yaml)
live_trading_enabled: false # must be true (plus an env var) before real money can trade

entry_cutoff: "15:30"       # no new trades after this (ET)
flatten_time: "15:55"       # close everything (half days shift automatically)
db_path: data/scalpcity.db

data:
  source: alpaca            # backtest/replay bars: alpaca | polygon (real data) | csv | synthetic (testing only)
  live_data: alpaca         # paper/live prices: alpaca (uses your Alpaca keys) | polygon (needs real-time plans)
  alpaca_stock_feed: iex    # iex = free, real-time, IEX exchange only | sip = paid, every exchange
  alpaca_options_feed: indicative  # indicative = free, derived quotes | opra = paid, real exchange quotes
  polygon_feed: realtime    # only for live_data: polygon. realtime | delayed (15 min late; testing only)
  csv_dir: data/bars
  quote_poll_seconds: 2

broker:
  name: alpaca              # backtest/replay always use the built-in simulator
  order_timeout_seconds: 8
  exit_retries: 3           # walk the exit price down this many times, then send a market order

risk:                       # account-wide limits (apply to all workers together)
  max_daily_loss: 900       # hit this -> kill switch: flatten everything, stop for the day (TJR Day 13: 1-3% a day)
  max_open_positions: 3
  max_premium_exposure: 6000
  max_spread_pct: 12
  min_premium: 0.30
  max_premium: 15.0
  pdt_guard: true
  max_trades_per_day: 1     # entries across ALL towers per day. TJR Day 29: "stick to one for now" until proven

research:                   # no trade on a hunch: evidence from past sessions before every entry
  enabled: true
  lookback_days: 5          # sessions studied before trading (and rolling forward each day)
  # A past signal "won" if price moved target_atr ATRs its way before stop_atr ATRs against it,
  # within horizon_minutes (ATR = 1-minute ATR at the signal).
  target_atr: 1.0
  stop_atr: 0.7
  horizon_minutes: 20
  # A trigger trades a ticker only once it's proven there: enough past signals AND a real edge.
  min_samples: 6
  min_win_rate: 0.45        # a coin flip reaches 1.0 ATR before 0.7 ATR about 41% of the time
  min_avg_r: 0.05
  min_room_atr: 1.0         # skip if a marked level (prior day high, turning point...) is closer than this
  level_merge_pct: 0.1
  # Multi-timeframe check: never trade against the trend on these timeframes (a range doesn't block).
  align_timeframes: [15m, 1h, D]
  zone_impulse_atr: 2.0     # supply/demand zone = quiet base before a move of 2+ ATRs (15m / 30m / 1h)
  # TJR's model is the same on every chart, and its setups are rare: score it across all tickers together.
  pooled_triggers: [smc_retrace, smc_bos]

smc:                        # TJR's boot camp model (docs/tjr-bootcamp/README.md)
  setup_timeframes: [5m, 15m]   # sweep + break read here; entered on a break one timeframe lower (5m->1m, 15m->5m)
  target_timeframes: [5m, 15m, 1h]  # resting highs/lows used as targets (plus the prior day's high/low)
  stop_buffer_atr: 0.1      # stop this far beyond the swept high/low (spread room, Day 38)
  min_rr: 1.0               # first target at least 1:1 (Day 37)
  max_setup_minutes: 120
  horizon_minutes: 120      # how long a past setup gets to reach its stop or target when scoring it
  require_daily_bias: true  # trade only with the daily structure (Days 34-36)
  require_sweep: true       # a break without a prior sweep of resting liquidity is not the model (Days 12, 30)

news:                       # TJR Day 19: never trade CPI, PPI, FOMC or NFP days; wait after other big releases
  enabled: true
  # FOMC decision days: 2026 schedule as published (Jan 28, Mar 18, Apr 29, Jun 17, Jul 29, Sep 16, Oct 28, Dec 9).
  # CPI / PPI / jobs dates below are UNVERIFIED (third-party calendars; bls.gov was unreachable from the cloud
  # session). Check https://www.bls.gov/schedule/ and add the rest: a missing date means NO blackout that day.
  blackout_days:
    "2026-01-28": FOMC
    "2026-03-18": FOMC
    "2026-04-29": FOMC
    "2026-06-17": FOMC
    "2026-07-29": FOMC
    "2026-09-16": FOMC
    "2026-10-02": NFP (unverified)
    "2026-10-14": CPI (unverified)
    "2026-10-15": PPI (unverified)
    "2026-10-28": FOMC
    "2026-12-04": NFP
    "2026-12-09": FOMC
  events: {}                # "2026-10-16 10:00": Retail sales  -> no entries until 30 min after
  wait_minutes: 30
  derisk_days:              # TJR Day 39: half size (half days are automatic)
    "2026-11-25": day before Thanksgiving

sim:                        # simulator used by backtest / replay
  starting_cash: 30000
  # implied volatility used to model option prices when real option bars aren't used (or are missing).
  # Single-stock values are the at-the-money weekly IVs seen on 2026-10-16; update them now and then.
  iv: {SPY: 0.15, QQQ: 0.18, IWM: 0.22, NVDA: 0.38, TSLA: 0.67, AAPL: 0.27, META: 0.64, AMZN: 0.30,
       AMD: 0.57, MSFT: 0.25}
  strike_step: {SPY: 1, QQQ: 1, IWM: 1, NVDA: 2.5, TSLA: 2.5, AAPL: 2.5, META: 2.5, AMZN: 2.5, AMD: 2.5,
                MSFT: 2.5}
  # weekdays with a listed expiry (0=Mon .. 4=Fri), as listed in October 2026 (TSLA: Mon/Fri; others Mon/Wed/Fri).
  expiry_weekdays: {SPY: [0, 1, 2, 3, 4], QQQ: [0, 1, 2, 3, 4], IWM: [0, 1, 2, 3, 4], NVDA: [0, 2, 4],
                    TSLA: [0, 4], AAPL: [0, 2, 4], META: [0, 2, 4], AMZN: [0, 2, 4], AMD: [0, 2, 4],
                    MSFT: [0, 2, 4]}
  half_spread_pct: 0.5
  fee_per_contract: 0.03
  use_historical_option_bars: true    # price options from real option bars (data.source alpaca or polygon)

dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8765

# The workers (towers). Every tower trades TJR's model (smc_retrace): liquidity sweep -> break of
# structure -> retrace into an order block / fair value gap in discount or premium -> lower-timeframe
# break. Stop beyond the swept high/low, target the next resting liquidity, size so the stop costs
# about $300 (1% of the $30k sim account, TJR Day 13). The old indicator triggers (vwap_cross, ema50_cross,
# orb, zone_reaction, structure_break, fib_pullback) still exist but lost money in every corrected backtest;
# TJR Day 45: one strategy. QQQ TREND and QQQ are paused: three QQQ towers would triple one setup's risk.
workers:
  - name: QQQ OG
    symbol: QQQ
    triggers: [smc_retrace]
    sizing: {mode: risk, risk: 300, max_contracts: 20}
    exits: {measure: structure, max_hold_minutes: 120, exit_on_reversal: false}
    dte: 0                  # video narration says "one day to expiration"; prices on screen match 0DTE
    strike: atm
    start_time: "09:35"
    end_time: "11:00"       # TJR Day 29: a trade within the first 1.5 hours of the NY open, or none
    daily_goal: 600
    max_daily_loss: 300

  - name: QQQ TREND
    symbol: QQQ
    triggers: [smc_retrace]
    sizing: {mode: risk, risk: 300, max_contracts: 20}
    exits: {measure: structure, max_hold_minutes: 120, exit_on_reversal: false}
    strike: atm
    enabled: false          # same ticker as QQQ OG (see above)
    start_time: "09:35"
    end_time: "11:00"       # TJR Day 29: a trade within the first 1.5 hours of the NY open, or none
    daily_goal: 600
    max_daily_loss: 300

